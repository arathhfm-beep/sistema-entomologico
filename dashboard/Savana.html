<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Dengue</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(135deg,#eef2f7,#dde3ec);
}

/* CONTENEDOR */
.dashboard{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  margin-bottom:25px;
}

.header-left h1{
  margin:0;
  font-size:34px;
  font-weight:800;
  letter-spacing:1px;
}

.header-left p{
  margin:5px 0 0;
  color:#6b7280;
}

select{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
  cursor:pointer;
}

/* KPIs */
.kpis{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.kpi{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  position:relative;
  overflow:hidden;
}

.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  height:100%;
  width:6px;
}

.kpi-red::before{ background:#ef4444; }
.kpi-orange::before{ background:#f59e0b; }
.kpi-blue::before{ background:#3b82f6; }

.kpi-label{
  font-size:14px;
  color:#6b7280;
}

.kpi-value{
  font-size:34px;
  font-weight:bold;
  margin-top:5px;
}

canvas{
  height:360px !important;
}

/* CARDS */
.card{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  transition:0.2s;
}

.card h3{
  margin:0 0 10px;
}

/* GRID */
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:20px;
}

.full{
  margin-bottom:20px;
}

/* MAPAS */
#mapCasos, #mapPHMR{
  height:380px;
  border-radius:12px;
}
#treemapMunicipios,
.card canvas{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto;
}

/* GRAFICA */
canvas{
  height:360px !important;
}

.card-grafica{
  height:500px; /* 👈 tamaño grande fijo */
  position:relative;
}

.card-grafica canvas{
  width:90% !important;
  height:90% !important;
}

/* RESPONSIVE */
@media(max-width:900px){

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .header-left h1{
    font-size:26px;
  }

  .grid-2{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="dashboard">

  <!-- HEADER PRO -->
  <header class="header">
    <div class="header-left">
      <h1 id="tituloMunicipio">NUEVO LEÓN</h1>
      <p>Vigilancia Epidemiológica y Entomológica</p>
    </div>

    <div class="header-right">
      <select id="filtroMunicipio"></select>
    </div>
  </header>

  <!-- KPIs -->
  <section class="kpis">
    <div class="kpi kpi-red">
      <div class="kpi-label">Confirmados</div>
      <div class="kpi-value" id="kpiConfirmados">0</div>
    </div>

    <div class="kpi kpi-orange">
      <div class="kpi-label">Probables</div>
      <div class="kpi-value" id="kpiProbables">0</div>
    </div>

    <div class="kpi kpi-blue">
      <div class="kpi-label">Foráneos</div>
      <div class="kpi-value" id="kpiForaneos">0</div>
    </div>
  </section>

  <!-- GRAFICA -->
  <section class="card full card-grafica">
    <h3>Comportamiento de Casos y PHMR</h3>
    <canvas id="graficaCasos"></canvas>
  </section>

  <!-- MAPAS -->
  <section class="grid-2">
    <div class="card">
      <h3>Mapa de Casos</h3>
      <div id="mapCasos"></div>
    </div>

    <div class="card">
      <h3>Mapa PHMR</h3>
      <div id="mapPHMR"></div>
    </div>
  </section>

  <!-- TREEMAP + DONA -->
  <section class="grid-2">
    <div class="card">
      <h3>Casos confirmados por municipio</h3>
      <div id="treemapMunicipios"></div>
    </div>

    <div class="card">
      <h3>Clasificación de casos</h3>
      <canvas id="donaClasificacion"></canvas>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<script src="../script/savana.js"></script>
</body>
</html>
