<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de Calor PHMR</title>

  <!-- Leaflet & Plugins -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.css">

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="phmr-diseno-casos.css">
<link rel="stylesheet" href="slider-semana-unificado.css">
</head>
<body>

  <!-- Encabezado -->
  <div id="header">
    <h1 id="tituloPrincipal">Mapa de calor - PHMR</h1>
  </div>

  <!-- Panel de controles -->
  <div id="panel">

  <div
    class="control-card"
    id="controlJurisdiccion"
  >
    <label>Jurisdicción:</label><br>

    <select id="jurisdiccionSelect">
      <option value="">Todo el estado</option>
      <option value="1">Jurisdicción 1</option>
      <option value="2">Jurisdicción 2</option>
      <option value="3">Jurisdicción 3</option>
      <option value="4">Jurisdicción 4</option>
      <option value="5">Jurisdicción 5</option>
      <option value="6">Jurisdicción 6</option>
      <option value="7">Jurisdicción 7</option>
      <option value="8">Jurisdicción 8</option>
    </select>
  </div>


  <div class="control-card">

    <label>Municipio:</label><br>

    <select id="municipioSelect">
      <option value="">
        Cargando municipios...
      </option>
    </select>

  </div>


  <div class="control-card">

    <label>Semana:</label><br>

    <div id="semanaTexto"></div>

    <div id="sliderSemana"></div>

  </div>

</div>

    
  </div>

  <main class="container phmr-container">
    <!-- Mapa -->
       <section class="card">
      <h4 class="phmr-map-title">Mapa de calor PHMR</h4>
       <div id="map"></div>
  </section>

      <!-- Gráfica -->
      <div id="chartContainer" class="panel-table">
        <h4>Promedio Semanal de PHMR</h4>
        <canvas id="graficaPHMR"></canvas>
        <div id="panelInfoPHMR"></div>
      </div>

  </main>
 

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../script/permisos.js"></script>
  <script src="../script/phmr.js"></script>

</body>
</html>
