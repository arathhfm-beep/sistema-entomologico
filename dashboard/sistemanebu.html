<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sistema Estratégico de Nebulizacion</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

  <!-- Tipografía moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="header">
    <h1 id="tituloPrincipal">Sistema Estratégico de Generación de Bunches de Nebulización </h1>
  </div>

  <!-- =========================================================
       PANEL DE CONTROLES ESTILO PHMR
    ========================================================== -->
  <div id="panel">

    <div class="control-card">
      <label>Jurisdicción:</label>
      <select id="jurisdiccionSelect">
        <option value="">Todas</option>
        <option value="1">Jurisdicción 1</option>
        <option value="2">Jurisdicción 2</option>
        <option value="3">Jurisdicción 3</option>
        <option value="4">Jurisdicción 4</option>
        <option value="5">Jurisdicción 5</option>
        <option value="6">Jurisdicción 6</option>
        <option value="7">Jurisdicción 7</option>
        <option value="8">Jurisdicción 8</option>
      </select>
    </div>

    <div class="control-card">
      <label>Municipio:</label>
      <select id="municipioSelect">
        <option value="">-- Selecciona municipio --</option>
      </select>
    </div>

    <div class="control-card">
  <label>Semana epidemiológica:</label>

  <div class="rango-semanas">
    <input type="number" id="semanaInicio" min="1" max="52" value="40">
    <span class="separador">–</span>
    <input type="number" id="semanaFin" min="1" max="52" value="42">
  </div>
</div>

    <div class="control-card">
      <label class="control-label">Vehículos disponibles:</label>
      <input type="number" id="vehiculos" min="1" max="10" value="2">
    </div>

    <button class="btn" id="btnGenerar">Generar</button>
  </div>

  <main class="container">
    <section class="card">
      <div id="map"></div>
      <button class="btn" id="btnExportar">Exportar mapa</button>
  </section>

  <div id="tablaContainer" class="panel-table">
    <h4>Bunches sugeridos</h4>
  <table id="tablaBunches" class="tablaPHMR">
    <thead>
      <tr>
        <th>Bunche</th>
        <th>Riesgo</th>
        <th>Color</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script src="https://unpkg.com/leaflet-image/leaflet-image.js"></script>
  <script>
    let map;
    let capaBunches = null;
    const coloresBunches = {};

    /* ------------------------------------------------------------
       1. INICIALIZACIÓN
     ------------------------------------------------------------ */
   document.addEventListener(
  "DOMContentLoaded",
  async () => {

    map = L.map("map")
      .setView(
        [25.7, -100.3],
        11
      );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "© OpenStreetMap"
      }
    ).addTo(map);


    // 1. Configurar jurisdicción según rol
    configurarJurisdiccionSEGBN();


    // 2. Cargar territorio autorizado
    await cargarMunicipiosPermitidosSEGBN();


    // 3. Activar botón
    document
      .getElementById("btnGenerar")
      .addEventListener(
        "click",
        cargarBunches
      );
  }
);
    /* ------------------------------------------------------------
   2. TERRITORIO SEGÚN PERMISOS
------------------------------------------------------------ */

function configurarJurisdiccionSEGBN() {

  const rol = (
    sessionStorage.getItem("rol_entomo") || ""
  )
    .trim()
    .toUpperCase();

  const jurisdiccionSesion =
    sessionStorage.getItem("jurisdiccion_entomo");

  const select =
    document.getElementById("jurisdiccionSelect");


  // ============================================
  // SUPERVISOR
  // ============================================

  if (rol === "SUPERVISOR") {

    select.disabled = false;

    return;
  }


  // ============================================
  // JURISDICCIONAL / ADMINISTRATIVO
  // ============================================

  const jur =
    Number(jurisdiccionSesion);


  if (
    !Number.isInteger(jur) ||
    jur < 1 ||
    jur > 8
  ) {

    console.error(
      "Jurisdicción de sesión inválida:",
      jurisdiccionSesion
    );

    select.innerHTML = `
      <option value="">
        Jurisdicción no disponible
      </option>
    `;

    select.disabled = true;

    return;
  }


  // Dejar únicamente su jurisdicción

  select.innerHTML = "";

  const option =
    document.createElement("option");

  option.value = String(jur);

  option.textContent =
    `Jurisdicción ${jur}`;

  option.selected = true;

  select.appendChild(option);

  select.disabled = true;
}


/* ------------------------------------------------------------
   CARGAR MUNICIPIOS PERMITIDOS
------------------------------------------------------------ */

async function cargarMunicipiosPermitidosSEGBN() {

  const token =
    sessionStorage.getItem("token_entomo");

  const rol = (
    sessionStorage.getItem("rol_entomo") || ""
  )
    .trim()
    .toUpperCase();

  const jurisdiccionSelect =
    document.getElementById(
      "jurisdiccionSelect"
    );

  const municipioSelect =
    document.getElementById(
      "municipioSelect"
    );


  // Limpiar selector

  municipioSelect.innerHTML = `
    <option value="">
      -- Selecciona municipio --
    </option>
  `;

  municipioSelect.disabled = true;


  // ============================================
  // PETICIÓN
  // ============================================

  const body = {
    token
  };


  /*
   * Solamente SUPERVISOR envía la jurisdicción
   * seleccionada.
   *
   * Para los demás roles la Edge Function obtiene
   * la jurisdicción directamente de la sesión.
   */

  if (
    rol === "SUPERVISOR" &&
    jurisdiccionSelect.value
  ) {

    body.jurisdiccion =
      Number(
        jurisdiccionSelect.value
      );
  }


  try {

    const response =
      await fetch(
        "https://dttmexasjpwdlnbikijx.supabase.co/functions/v1/municipios-permitidos",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "No fue posible cargar municipios"
      );
    }


    // ============================================
    // LLENAR MUNICIPIOS
    // ============================================

    for (
      const municipio
      of data.municipios || []
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        municipio.cve_municipio;

      option.textContent =
        municipio.nombre;

      municipioSelect.appendChild(
        option
      );
    }


    municipioSelect.disabled =
      (data.municipios || []).length === 0;


    console.log(
      "Municipios permitidos SEGBN:",
      data.municipios
    );


    return data;

  } catch (error) {

    console.error(
      "Error cargando municipios SEGBN:",
      error
    );

    municipioSelect.innerHTML = `
      <option value="">
        Error al cargar municipios
      </option>
    `;

    municipioSelect.disabled = true;

    return null;
  }
}


/* ------------------------------------------------------------
   CAMBIO DE JURISDICCIÓN
------------------------------------------------------------ */

document
  .getElementById("jurisdiccionSelect")
  .addEventListener(
    "change",
    async () => {

      await cargarMunicipiosPermitidosSEGBN();

      // Limpiar resultado anterior al cambiar territorio

      if (capaBunches) {

        map.removeLayer(capaBunches);

        capaBunches = null;
      }

      document.querySelector(
        "#tablaBunches tbody"
      ).innerHTML = "";
    }
  );

    /* ------------------------------------------------------------
       3. CARGAR BUNCHES DESDE EL ENDPOINT
     ------------------------------------------------------------ */
     function colorAleatorio() {
  const r = Math.floor(Math.random() * 156) + 50;
  const g = Math.floor(Math.random() * 156) + 50;
  const b = Math.floor(Math.random() * 156) + 50;
  return `rgb(${r}, ${g}, ${b})`;
}
function getColorBunche(buncheId) {
  if (!coloresBunches[buncheId]) {
    coloresBunches[buncheId] = colorAleatorio();
  }
  return coloresBunches[buncheId];
}
async function cargarBunches() {
  const jurisdiccion = parseInt(document.getElementById("jurisdiccionSelect").value, 10);
  const municipio = parseInt(document.getElementById("municipioSelect").value, 10);
  const semanaInicio = parseInt(document.getElementById("semanaInicio")?.value);
  const semanaFin = parseInt(document.getElementById("semanaFin")?.value);
  const vehiculos = parseInt(document.getElementById("vehiculos")?.value);
  const token = sessionStorage.getItem("token_entomo");

  if (isNaN(jurisdiccion) || isNaN(municipio)) {
    alert("Selecciona jurisdicción y municipio");
    return;
  }

  if (isNaN(semanaInicio) || isNaN(semanaFin)) {
    alert("Captura semanas válidas");
    return;
  }

  if (semanaFin < semanaInicio) {
    alert("La semana final no puede ser menor");
    return;
  }

  const semanas = [];
  for (let s = semanaInicio; s <= semanaFin; s++) semanas.push(s);

  try {
    const res = await fetch(
      "https://dttmexasjpwdlnbikijx.supabase.co/functions/v1/bunches-priorizados",
      {
        method: "POST",
        headers: {
           "Content-Type": "application/json",
      "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dG1leGFzanB3ZGxuYmlraWp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDg5MjcsImV4cCI6MjA4Mjg4NDkyN30.BgGvGZvX5WeKOenqDEHwyAM7fP6LtpbYcPt0V064XLo",
      "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0dG1leGFzanB3ZGxuYmlraWp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDg5MjcsImV4cCI6MjA4Mjg4NDkyN30.BgGvGZvX5WeKOenqDEHwyAM7fP6LtpbYcPt0V064XLo"
        },
        body: JSON.stringify({
          token,
          jurisdiccion,
          municipio,
          semanas,
          vehiculos
        })
      }
    );

    const r = await res.json();
    
    if (!r.valida) throw r.error;

    if (!r.data || r.data.length === 0) {
      alert("No hay bunches para esos criterios");
      return;
    }

    pintarBunches(r.data);
    actualizarTabla(r.data);

  } catch (e) {
    console.error("Error bunches:", e);
    alert("Error al generar bunches");
  }
}

    /* ------------------------------------------------------------
       4. TABLA DE BUNCHES
     ------------------------------------------------------------ */
function actualizarTabla(bunches) {
  const tbody = document.querySelector("#tablaBunches tbody");
  tbody.innerHTML = "";

  bunches.forEach(b => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${b.bunche_id}</td>
      <td><strong>${Number(b.riesgo_total).toFixed(1)}</strong></td>
      <td>${b.ranking}</td>
      <td>
        <span class="color-box"
          style="background:${getColorBunche(b.bunche_id)}">
        </span>
      </td>
    `;
    tbody.appendChild(tr);
  });
}
function pintarBunches(bunches) {
  if (capaBunches) map.removeLayer(capaBunches);

  const features = bunches.map(b => ({
    type: "Feature",
    geometry: b.geom_geojson,
    properties: {
      bunche: b.bunche_id,
      riesgo: b.riesgo_total,
      ranking: b.ranking
    }
  }));

  capaBunches = L.geoJSON(
    {
      type: "FeatureCollection",
      features
    },
    {
      // 🔑 CLAVE
      renderer: L.canvas(),

      style: f => ({
        fillColor: getColorBunche(f.properties.bunche),
        fillOpacity: 0.7,

        // sin bordes
        color: "transparent",
        weight: 0,
        opacity: 0
      }),

      onEachFeature: (f, layer) => {
        layer.bindPopup(`
          <strong>Bunche:</strong> ${f.properties.bunche}<br>
          <strong>Riesgo:</strong> ${f.properties.riesgo.toFixed(1)}<br>
          <strong>Ranking:</strong> ${f.properties.ranking}
        `);
      }
    }
  ).addTo(map);

  map.fitBounds(capaBunches.getBounds(), { padding: [20, 20] });
}
function getColor(ranking) {
  if (ranking <= 5) return "#d73027";
  if (ranking <= 10) return "#fc8d59";
  if (ranking <= 15) return "#fee08b";
  return "#91cf60";
}
document.getElementById("semanaInicio").addEventListener("change", e => {
  const ini = parseInt(e.target.value);
  const finEl = document.getElementById("semanaFin");
  const fin = parseInt(finEl.value);

  if (!isNaN(ini) && !isNaN(fin) && fin < ini) {
    finEl.value = ini;
  }
});
document.getElementById("btnExportar").addEventListener("click", exportarMapa);

function exportarMapa() {
  leafletImage(map, function(err, canvas) {
    if (err) {
      console.error(err);
      alert("Error al exportar mapa");
      return;
    }

    const img = document.createElement("a");
    img.href = canvas.toDataURL("image/png");
    img.download = "bunches_nebulizacion.png";
    img.click();
  });
}

  </script>

</body>
</html>
